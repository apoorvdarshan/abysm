# iOS release — GitHub Actions builds, signs and uploads ABYSM to App Store Connect,
# and creates the tag's GitHub Release.
#
# Xcode Cloud was removed for ABYSM on 2026-10-14 (its workflow and product were
# deleted in App Store Connect). Never re-create an Xcode Cloud workflow for v*
# tags: its triggers live in App Store Connect, not in this repo, so no switch here
# could stop it, and both pipelines would upload a build for the same tag.
#
# Trigger
#   push tag v<MARKETING_VERSION>   release run (e.g. v1.0.1 for MARKETING_VERSION 1.0.1;
#                                   any other v* tag fails before anything is built)
#   workflow_dispatch               validation run: archive, sign, export and validate the
#                                   IPA with App Store Connect. Never uploads, never touches
#                                   the listing, review or GitHub Releases. The optional
#                                   marketing_version input validates as a not-yet-approved
#                                   version (Apple refuses already-approved ones).
#
# Jobs (release run)
#   quality → prepare → build → wait-for-build → app-store-connect → github-release
#   Tag runs share one concurrency group and queue up (queue: max), so releases run
#   one at a time and a newer tag never cancels a pending one. Each validation run
#   has its own group. Waiting for App Store Connect to process the upload is its
#   own job (wait-for-build, which outputs build_id), so "Re-run failed jobs" after
#   a listing/screenshot/review failure keeps that result instead of waiting again
#   against the original upload deadline; the store step itself only sends what
#   differs, so re-running it is safe (see store/README.md). Build logs kept as an
#   artifact on failure have the App Store Connect key ID and issuer ID redacted in
#   every file and encoding (scripts/store/redact_logs.py); if redaction fails,
#   nothing is uploaded. On tag runs, prepare checks the tag's RELEASE_NOTES.md
#   section before anything is built: an empty or duplicated section fails there;
#   no section means GitHub generates the notes.
#
# Prepare (every run) tests the release tooling offline. The repository's listing
# and screenshots are checked only when their switches are on, so unused store
# assets never block a build-only release (PRs and main check them in
# store-checks.yml). On tag runs with IOS_CREATE_VERSION on, prepare then creates
# the tag's App Store version when App Store Connect does not have it yet (never
# on validation runs). Tag runs with a listing, What's New, screenshot or review
# switch on also run a read-only App Store Connect preflight before anything is
# built: the App Store version for the tag must exist (IOS_CREATE_VERSION creates
# a missing one; otherwise create it in App Store Connect first) and be in a
# state that allows the enabled steps.
#
# Store tooling (requirements-store.txt) runs on a pinned Python from
# actions/setup-python, never the runner's system Python, and store steps run
# unbuffered (python3 -u) so their progress shows in the live log.
#
# Switches (repository Variables; missing = off, invalid values fail the run).
# See store/README.md for the full table.
#   IOS_RELEASE_AUTOMATION   master switch for every iOS store operation below
#   IOS_CREATE_VERSION       create the tag's App Store version when it is missing
#                            (tag runs only; an existing version is left alone)
#   IOS_UPLOAD_BUILD         build + upload the binary to App Store Connect
#   IOS_UPLOAD_LISTING       description, keywords, promo text, URLs, name, subtitle
#   IOS_UPLOAD_WHATS_NEW     What's New text
#   IOS_UPLOAD_SCREENSHOTS   iPhone 6.9" + iPad 13" screenshots
#   IOS_SUBMIT_REVIEW        select THIS run's processed build, submit for review
#                            (needs IOS_UPLOAD_BUILD; never uses an older build)
#   IOS_PUBLIC_RELEASE       release automatically after approval (else manual)
#   IOS_BUILD_POLL_SECONDS   default 30   (10–600)
#   IOS_BUILD_WAIT_MINUTES   default 120  (10–300), counted from upload start,
#                            covering upload + App Store Connect processing
#
# Secrets
#   APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _API_KEY_P8
#       Admin-role key: build numbers, cloud-managed distribution signing,
#       upload, build readiness, listing and review.
#   IOS_DEV_SIGNING_P12_BASE64 / IOS_DEV_SIGNING_P12_PASSWORD
#       Shared CI Apple Development identity ("Apple Development: Created via
#       API", certificate NVNGDQGCKK, expires 2027-10-14) used only to sign the
#       archive; distribution signing at export is cloud-managed by Apple.

name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: >-
          Validation only: version to validate as (e.g. 1.0.1). Empty = the project
          version. Apple rejects versions already approved, so use the next one.
        required: false
        default: ""

permissions:
  contents: read

# Build numbers come from App Store Connect, so tag release runs never overlap:
# they share one group and run one at a time. Manual validation runs get their
# own group and can never cancel or wait behind a release run.
concurrency:
  group: ios-release-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false
  # Keep every waiting tag run queued; the default (single) would cancel an older
  # pending run when a third run joins the group.
  queue: max

jobs:
  # Release runs only: the full unit + UI test suite must pass for the tagged commit.
  quality:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ios-tests.yml
    permissions:
      contents: read

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.gates.outputs.mode }}
      create_version: ${{ steps.gates.outputs.create_version }}
      build: ${{ steps.gates.outputs.build }}
      upload_build: ${{ steps.gates.outputs.upload_build }}
      listing: ${{ steps.gates.outputs.listing }}
      whats_new: ${{ steps.gates.outputs.whats_new }}
      screenshots: ${{ steps.gates.outputs.screenshots }}
      submit: ${{ steps.gates.outputs.submit }}
      public_release: ${{ steps.gates.outputs.public_release }}
      asc: ${{ steps.gates.outputs.asc }}
      poll_seconds: ${{ steps.gates.outputs.poll_seconds }}
      wait_minutes: ${{ steps.gates.outputs.wait_minutes }}
      marketing_version: ${{ steps.gates.outputs.marketing_version }}
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /store/
            /Abysm.xcodeproj/
            /Abysm.storekit
            /Abysm/StoreManager.swift
            /requirements-store.txt
            /RELEASE_NOTES.md
            /.github/workflows/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve iOS release switches
        id: gates
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          IOS_BUILD_POLL_SECONDS: ${{ vars.IOS_BUILD_POLL_SECONDS }}
          IOS_BUILD_WAIT_MINUTES: ${{ vars.IOS_BUILD_WAIT_MINUTES }}
          VALIDATION_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: python3 scripts/store/ios_release.py gates

      # These checks must pass before anything reaches App Store Connect. The
      # repository's listing and screenshots are checked only by the gated dry
      # run below (when their switch is on); the release scope skips the tests
      # that check them unconditionally, so unused assets never block a release.
      - name: Check the release tooling and inputs (offline)
        env:
          STORE_TESTS_SCOPE: release
          UPLOAD_LISTING: ${{ steps.gates.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ steps.gates.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.screenshots }}
          SUBMIT_IOS_REVIEW: ${{ steps.gates.outputs.submit }}
          PUBLIC_RELEASE: ${{ steps.gates.outputs.public_release }}
        run: |
          python3 -m unittest discover -s scripts/store -p 'test_*.py'
          python3 scripts/store/validate_catalog.py
          python3 scripts/store/asc_release.py --dry-run --build-id DRY-RUN --build-number 1

      # Tag runs only: the GitHub Release notes must be usable before anything is
      # built or uploaded. github-release repeats this check when it runs.
      - name: Check release notes
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status=0
          python3 scripts/release_notes.py "$TAG" > /dev/null || status=$?
          # 0 = reviewed notes, 3 = no section (GitHub generates the notes); anything else fails.
          [ "$status" -eq 0 ] || [ "$status" -eq 3 ] || exit "$status"

      - name: Install store tooling
        if: >-
          steps.gates.outputs.build == 'true' || steps.gates.outputs.asc == 'true' ||
          steps.gates.outputs.create_version == 'true'
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      # Tag runs only (never validation runs). Adds the App Store version for this
      # tag when App Store Connect does not have it yet; an existing one is left
      # alone. Refuses, before anything is built and without writing, when another
      # version is still on its way to the store or this version is not newer
      # than every existing one. A version created here stays in Prepare for
      # Submission if a later step fails, and the next run for the same tag
      # reuses it.
      - name: Create the App Store version if it is missing (IOS_CREATE_VERSION)
        if: steps.gates.outputs.mode == 'release' && steps.gates.outputs.create_version == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          CREATE_IOS_VERSION: ${{ steps.gates.outputs.create_version }}
          MARKETING_VERSION: ${{ steps.gates.outputs.marketing_version }}
        run: python3 -u scripts/store/asc_release.py --create-version --version "$MARKETING_VERSION"

      # Tag runs only (asc is never on for a validation run): read-only checks that
      # the App Store version exists (turn on IOS_CREATE_VERSION or create it in
      # App Store Connect first), is in a state that allows the enabled steps,
      # has every repository locale, and that each catalog product due for review
      # can go with it. Fails here, before anything is built or uploaded.
      - name: Check the App Store version (read-only preflight)
        if: steps.gates.outputs.asc == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          UPLOAD_LISTING: ${{ steps.gates.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ steps.gates.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.screenshots }}
          SUBMIT_IOS_REVIEW: ${{ steps.gates.outputs.submit }}
          PUBLIC_RELEASE: ${{ steps.gates.outputs.public_release }}
          MARKETING_VERSION: ${{ steps.gates.outputs.marketing_version }}
        run: python3 -u scripts/store/asc_release.py --preflight --version "$MARKETING_VERSION"

      - name: Choose the build number
        id: number
        if: steps.gates.outputs.build == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: python3 -u scripts/store/ios_release.py build-number

  build:
    needs: [quality, prepare]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.quality.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.quality.result == 'skipped'))
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MODE: ${{ needs.prepare.outputs.mode }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      BUNDLE_ID: com.apoorvdarshan.Abysm
      TEAM_ID: 23RV7FYH36
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    outputs:
      upload_started_at: ${{ steps.upload.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # The app, its project and test folders, and the log redactor; never
          # web/ or store/.
          sparse-checkout: |
            /Abysm/
            /Abysm.xcodeproj/
            /Abysm.storekit
            /AbysmTests/
            /AbysmUITests/
            /scripts/store/redact_logs.py

      # Dependency sources only. Signed store archives are always built from
      # scratch (fresh DerivedData), never from a build cache.
      - name: Cache pinned Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-release-packages
          key: ios-release-spm-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('Abysm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check toolchain and inputs
        run: |
          xcodebuild -version
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "error: no build number from prepare job" >&2; exit 1; }
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "error: bad marketing version" >&2; exit 1; }
          case "$DEVELOPER_DIR" in *beta*|*Beta*) echo "error: App Store builds need a released Xcode" >&2; exit 1 ;; esac

      - name: Install signing identity and App Store Connect key
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_SIGNING_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "error: missing signing secret $name" >&2; exit 1; }
          done
          umask 077
          keys="$RUNNER_TEMP/asc-keys"
          mkdir -p "$keys"
          python3 -c 'import os,sys; open(sys.argv[1],"w").write(os.environ["ASC_KEY_P8"].replace("\\n","\n").strip()+"\n")' \
            "$keys/AuthKey_${ASC_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/abysm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's WWDR G3 intermediate completes the development identity's chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr-g3.cer"
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/wwdr-g3.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$keychain" > /dev/null
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
          grep -qE '[1-9][0-9]* valid identit' "$RUNNER_TEMP/identities.txt" || { echo "error: no valid signing identity in the CI keychain" >&2; exit 1; }
          {
            echo "ASC_KEY_PATH=$keys/AuthKey_${ASC_KEY_ID}.p8"
            echo "API_PRIVATE_KEYS_DIR=$keys"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Archive Release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          log="$RUNNER_TEMP/logs/archive.log"
          status=0
          xcodebuild archive \
            -project Abysm.xcodeproj \
            -scheme Abysm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Abysm.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath .ios-release-packages \
            -onlyUsePackageVersionsFromResolvedFile \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |\*\* ARCHIVE' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: archive failed (full log in artifact)" >&2; exit "$status"; }

      - name: Verify app identity and version in every bundle
        run: |
          set -euo pipefail
          apps="$RUNNER_TEMP/Abysm.xcarchive/Products/Applications"
          main="$(find "$apps" -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$main" ] || { echo "error: the archive contains no app" >&2; exit 1; }
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$main/Info.plist")"
          [ "$id" = "$BUNDLE_ID" ] || { echo "error: archived $id, expected $BUNDLE_ID" >&2; exit 1; }
          # The app and any extensions must carry the same version and build
          # number (resource/framework bundles excluded).
          checked=0
          while IFS= read -r -d '' bundle; do
            plist="$bundle/Info.plist"
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
            if [ "$short" != "$MARKETING_VERSION" ] || [ "$build" != "$BUILD_NUMBER" ]; then
              echo "error: ${bundle#"$apps"/} is $short ($build), expected $MARKETING_VERSION ($BUILD_NUMBER)" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(printf '%s\0' "$main"; find "$main" -mindepth 1 -type d \( -name '*.app' -o -name '*.appex' \) -not -path '*/Frameworks/*' -print0)
          echo "verified $BUNDLE_ID $MARKETING_VERSION ($BUILD_NUMBER) in $checked app/extension bundle(s)"

      - name: Write export options
        run: |
          destination="export"
          [ "$MODE" = release ] && destination="upload"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>${destination}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export and validate with App Store Connect (validation run)
        if: env.MODE == 'validate'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logs/export.log"
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Abysm.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |\*\* EXPORT' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: export failed (full log in artifact)" >&2; exit "$status"; }
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n1)"
          [ -n "$ipa" ] || { echo "error: export produced no IPA" >&2; exit 1; }
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/logs/validate.log"
          echo "validated $MARKETING_VERSION ($BUILD_NUMBER) with App Store Connect — nothing uploaded"

      - name: Upload to App Store Connect (release run)
        id: upload
        if: env.MODE == 'release'
        run: |
          set -euo pipefail
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          log="$RUNNER_TEMP/logs/upload.log"
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Abysm.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |[Uu]pload|\*\* EXPORT' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: upload failed (full log in artifact)" >&2; exit "$status"; }
          echo "uploaded $MARKETING_VERSION ($BUILD_NUMBER); App Store Connect processing is checked next"

      - name: Collect logs
        id: collect-logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          # xcodebuild and altool echo their command lines (API key ID, issuer ID)
          # into these logs. Artifacts are not masked like the console, so both IDs
          # are redacted in every file, binary and UTF-16 included. A file that
          # cannot be redacted is removed; if redaction itself fails, this step
          # fails and nothing is uploaded.
          python3 scripts/store/redact_logs.py "$RUNNER_TEMP/logs" ASC_KEY_ID ASC_ISSUER_ID

      - name: Keep build logs
        if: failure() && steps.collect-logs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/export" "$RUNNER_TEMP/wwdr-g3.cer"

  # Its own job, so "Re-run failed jobs" after a later store-step failure keeps
  # this result instead of waiting again against the original upload deadline.
  wait-for-build:
    needs: [quality, prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode == 'release' &&
      needs.prepare.outputs.upload_build == 'true' &&
      needs.quality.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Covers IOS_BUILD_WAIT_MINUTES (max 300), counted from upload start.
    timeout-minutes: 310
    outputs:
      build_id: ${{ steps.wait.outputs.build_id }}
    env:
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /requirements-store.txt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install store tooling
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      # Job outputs reach the script through env, never expanded into the shell.
      - name: Wait for App Store Connect to process this build
        id: wait
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          UPLOAD_STARTED_AT: ${{ needs.build.outputs.upload_started_at }}
          WAIT_MINUTES: ${{ needs.prepare.outputs.wait_minutes }}
          POLL_SECONDS: ${{ needs.prepare.outputs.poll_seconds }}
        run: |
          python3 -u scripts/store/ios_release.py wait-build \
            --version "$MARKETING_VERSION" \
            --build "$BUILD_NUMBER" \
            --started-at "$UPLOAD_STARTED_AT" \
            --wait-minutes "$WAIT_MINUTES" \
            --poll-seconds "$POLL_SECONDS"

  app-store-connect:
    needs: [quality, prepare, build, wait-for-build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode == 'release' &&
      needs.prepare.outputs.asc == 'true' &&
      needs.quality.result == 'success' &&
      ((needs.build.result == 'success' && needs.wait-for-build.result == 'success') ||
       (needs.prepare.outputs.upload_build != 'true' &&
        needs.build.result == 'skipped' && needs.wait-for-build.result == 'skipped'))
    runs-on: ubuntu-latest
    # Listing, screenshots (each of the two sets waits up to 10 min for processing)
    # and submission. The build wait has its own job above.
    timeout-minutes: 45
    env:
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /store/
            /requirements-store.txt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install store tooling
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      - name: Listing / What's New / screenshots / review (gated)
        env:
          UPLOAD_LISTING: ${{ needs.prepare.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ needs.prepare.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ needs.prepare.outputs.screenshots }}
          SUBMIT_IOS_REVIEW: ${{ needs.prepare.outputs.submit }}
          PUBLIC_RELEASE: ${{ needs.prepare.outputs.public_release }}
          BUILD_ID: ${{ needs.wait-for-build.outputs.build_id }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          args=(--version "$MARKETING_VERSION")
          if [ -n "$BUILD_ID" ]; then
            args+=(--build-id "$BUILD_ID" --build-number "$BUILD_NUMBER")
          fi
          python3 -u scripts/store/asc_release.py "${args[@]}"

  # One tag → one pipeline: the GitHub Release (formerly github-release.yml) is
  # created only after every enabled step above succeeded.
  github-release:
    needs: [quality, prepare, build, wait-for-build, app-store-connect]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.quality.result == 'success' && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.wait-for-build.result == 'success' || needs.wait-for-build.result == 'skipped') &&
      (needs.app-store-connect.result == 'success' || needs.app-store-connect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release_notes.py
            /scripts/store/print_gates.py
            /RELEASE_NOTES.md

      - name: Print iOS release switches
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          IOS_BUILD_POLL_SECONDS: ${{ vars.IOS_BUILD_POLL_SECONDS }}
          IOS_BUILD_WAIT_MINUTES: ${{ vars.IOS_BUILD_WAIT_MINUTES }}
        run: python3 scripts/store/print_gates.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPLOADED_BUILD: ${{ needs.build.result == 'success' && needs.prepare.outputs.build_number || '' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          status=0
          python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md" || status=$?
          case "$status" in
            0) notes=(--notes-file "$RUNNER_TEMP/release-notes.md") ;;
            3) notes=(--generate-notes) ;;
            *) exit "$status" ;;
          esac
          title="ABYSM $TAG"
          [ -n "$UPLOADED_BUILD" ] && title="$title (build $UPLOADED_BUILD)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" "${notes[@]}" --latest
