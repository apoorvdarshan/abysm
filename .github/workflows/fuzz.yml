name: Fuzzing

# Atheris fuzz targets (fuzz/README.md) for the apoorvdarshan/store-release code
# ABYSM's release workflows run, at the commit they pin: the release switches and
# stage gates, the release notes reader, the log redaction, and the config loader
# with store/store-release.toml. Advisory, not a required check. Each target runs
# 60 seconds on pull requests and pushes to main that touch what it tests, 10
# minutes in the weekly run, and the seconds asked for in a manual run. Synthetic
# inputs only: no secrets. A newer push to a pull request cancels its older run;
# pushes to main, scheduled and manual runs are never cancelled. A failing input is
# kept as the job's artifact; replay it with
#   python3 -I fuzz/<target>_fuzz.py <crash file>
on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'store/store-release.toml'
      - 'RELEASE_NOTES.md'
      - 'Abysm.xcodeproj/project.pbxproj'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-checks.yml'
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'store/store-release.toml'
      - 'RELEASE_NOTES.md'
      - 'Abysm.xcodeproj/project.pbxproj'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-checks.yml'
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (1-1800)
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [release_gates, release_notes, redact_logs, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fuzz/
            /store/store-release.toml
            /RELEASE_NOTES.md
            /Abysm.xcodeproj/project.pbxproj
            /.github/workflows/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The commit every apoorvdarshan/store-release `uses:` line in the release
      # workflows names (it fails when they disagree or one is not a full SHA), so a
      # store-release bump is fuzzed in its own pull request. Fetched anonymously and
      # checked against the pin before anything runs.
      - name: Fetch store-release at the commit the release workflows pin
        run: python3 -I fuzz/store_release_pin.py --fetch .store-release

      - name: Install the hash-pinned fuzzer
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r fuzz/requirements.txt

      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || inputs.seconds || '60' }}
        run: |
          set -euo pipefail
          if ! [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || (( FUZZ_SECONDS < 1 || FUZZ_SECONDS > 1800 )); then
            echo "error: seconds must be a whole number from 1 to 1800, got '$FUZZ_SECONDS'" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crashes"
          python3 -I "fuzz/${TARGET}_fuzz.py" -max_total_time="$FUZZ_SECONDS" -timeout=25 -rss_limit_mb=2048 \
            -print_final_stats=1 -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/corpus"

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crashes/
          if-no-files-found: ignore
          retention-days: 14
