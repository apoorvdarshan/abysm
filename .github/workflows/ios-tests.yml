name: iOS tests

# Unit (AbysmTests) and UI (AbysmUITests) tests on an iOS Simulator. Debug
# simulator builds only: nothing is signed, archived or uploaded. Runs only when
# the app, its tests, its project or this workflow change; release tags call it
# from ios-release.yml before anything is built for the App Store.
on:
  pull_request:
    paths:
      - 'Abysm/**'
      - 'AbysmTests/**'
      - 'AbysmUITests/**'
      - 'Abysm.xcodeproj/**'
      - 'Abysm.storekit'
      - 'scripts/test-ios.sh'
      - '.github/workflows/ios-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Abysm/**'
      - 'AbysmTests/**'
      - 'AbysmUITests/**'
      - 'Abysm.xcodeproj/**'
      - 'Abysm.storekit'
      - 'scripts/test-ios.sh'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Pushes to main, manual
# runs and release callers each get their own group and are never cancelled.
concurrency:
  group: ios-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      IOS_TEST_PACKAGES: ${{ github.workspace }}/.ios-test-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Only what the build and tests read; never web/ or marketing/.
          sparse-checkout: |
            /Abysm/
            /Abysm.xcodeproj/
            /Abysm.storekit
            /AbysmTests/
            /AbysmUITests/
            /scripts/test-ios.sh

      # Pinned Swift package sources only; tests always run fresh.
      - name: Cache pinned Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-test-packages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('Abysm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and run unit and UI tests
        env:
          IOS_TEST_RESULTS: ${{ runner.temp }}/ios-test-results
          IOS_TEST_DERIVED_DATA: ${{ runner.temp }}/ios-test-build
        run: bash scripts/test-ios.sh

      - name: Keep test results and failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-test-results
          if-no-files-found: warn
          retention-days: 7
