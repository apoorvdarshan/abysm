# Static analysis (SAST) of the Swift app with GitHub CodeQL.
#
# Swift needs a real compile for CodeQL to observe, so this builds the Abysm
# scheme for the iOS Simulator (Debug, unsigned, arm64 only: one architecture
# gives CodeQL the same source at half the build time) with no build cache.
# It uses macos-26 and its default Xcode 26 rather than xcode-27: CodeQL's
# tracer starts build tools as x86_64, and Xcode 27's tools (swift-plugin-server,
# sandbox-exec on macOS 27) are arm64-only, so a traced Xcode 27 build fails with
# "Bad CPU type in executable".
# Nothing is signed, archived or uploaded. The ~30-minute macOS build is too slow
# for every pull request, so it runs weekly, for each release tag and on demand;
# codeql.yml still analyzes the Python, JavaScript and workflows on every pull
# request.

name: CodeQL (Swift)

on:
  # Release tags (the same v* tags ios-release.yml ships), so every release is analyzed.
  push:
    tags:
      - "v*"
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Abysm/
            /Abysm.xcodeproj/
            /Abysm.storekit

      # SwiftPM evaluates package manifests inside sandbox-exec, which cannot be
      # spawned under CodeQL's build tracer. Resolve the pinned packages first,
      # before CodeQL starts tracing, then build with the manifest sandbox off
      # and no further resolution.
      - name: Resolve the pinned Swift packages
        run: |
          xcodebuild -version
          xcodebuild -resolvePackageDependencies \
            -project Abysm.xcodeproj \
            -scheme Abysm \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/codeql-packages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project Abysm.xcodeproj \
            -scheme Abysm \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/codeql-packages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -IDEPackageSupportDisableManifestSandbox=YES \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:swift"
