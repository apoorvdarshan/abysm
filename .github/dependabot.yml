# Dependabot version updates. Dependabot alerts are enabled in the repository
# settings; this file keeps the pinned versions current:
#   github-actions  the commit-SHA-pinned actions in every workflow
#   pip             the hash-locked App Store Connect tooling (requirements-store.in
#                   compiled to requirements-store.txt), which runs next to the App
#                   Store Connect key in the release jobs
#   swift           the RevenueCat package pinned in the Xcode project's Package.resolved
#
# Each ecosystem comes as one grouped PR. Updates to the app or to ios-tests.yml
# run the iOS tests on a paid macOS runner, so the Swift package and the actions
# are checked monthly; the store tooling (Ubuntu-only checks) weekly.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      store-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Store tooling"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: "iOS"
